name: k6 Load Test

on:
  workflow_dispatch:
    inputs:
      test_type:
        description: 'Load test strategy to run'
        required: true
        type: choice
        default: smoke
        options:
          - smoke
          - load
          - stress
          - spike
          - soak
          - breakpoint
          - all
      base_url:
        description: 'Target base URL (leave blank to use the SNIP_BASE_URL repo secret)'
        required: false

jobs:
  resolve-matrix:
    runs-on: ubuntu-latest
    outputs:
      types: ${{ steps.set.outputs.types }}
    steps:
      - id: set
        run: |
          if [ "${{ inputs.test_type }}" = "all" ]; then
            echo 'types=["smoke","load","stress","spike","soak","breakpoint"]' >> "$GITHUB_OUTPUT"
          else
            echo 'types=["${{ inputs.test_type }}"]' >> "$GITHUB_OUTPUT"
          fi

  k6-test:
    needs: resolve-matrix
    runs-on: ubuntu-latest
    strategy:
      max-parallel: 1
      fail-fast: false
      matrix:
        type: ${{ fromJson(needs.resolve-matrix.outputs.types) }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Resolve target URL
        id: url
        env:
          INPUT_URL: ${{ inputs.base_url }}
          SECRET_URL: ${{ secrets.SNIP_BASE_URL }}
        run: |
          URL="${INPUT_URL:-$SECRET_URL}"
          if [ -z "$URL" ]; then
            echo "::error::No base_url input given and the SNIP_BASE_URL repo secret is not set. Add it under Settings > Secrets and variables > Actions, or pass base_url when running this workflow."
            exit 1
          fi
          echo "url=$URL" >> "$GITHUB_OUTPUT"

      - name: Run k6 ${{ matrix.type }} test
        uses: grafana/k6-action@v0.3.1
        with:
          filename: k6/scenarios/${{ matrix.type }}.js
        env:
          BASE_URL: ${{ steps.url.outputs.url }}

      - name: Upload HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: k6-report-${{ matrix.type }}
          path: ${{ matrix.type }}-report.html
          if-no-files-found: warn
